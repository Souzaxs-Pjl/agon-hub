name: Validar AGON Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agon_hub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agon_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: agon_hub
      JWT_SECRET: github-actions-secret-for-testing-only-123456789
      JWT_EXPIRES_IN: 2h
      ADMIN_NOME: Admin CI
      ADMIN_EMAIL: admin-ci@agonhub.example
      ADMIN_SENHA: AdminCI@123456
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do backend
        run: npm install
      - name: Criar estrutura do banco de teste
        run: |
          psql -h localhost -U postgres -d agon_hub -f ../database/schema.sql
          psql -h localhost -U postgres -d agon_hub -f ../database/seed.sql
        env:
          PGPASSWORD: postgres
      - name: Criar administrador de teste
        run: npm run criar-admin
      - name: Iniciar API
        run: |
          nohup npm start > /tmp/agon-api.log 2>&1 &
          for tentativa in {1..30}; do
            if curl --silent --fail http://localhost:3000/api/saude; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/agon-api.log
          exit 1
      - name: Executar testes automatizados
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do frontend
        run: npm install
      - name: Gerar build de produção
        run: npm run build
